<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hollowmere — First-Person Dungeon ARPG</title>
<style>
:root{
  --gold:#c9a86a; --gold2:#e8d5a8; --blood:#a32b2b; --mana:#3a6fb5; --stam:#5a9a4a;
  --bg:#08080a; --panel:rgba(14,12,10,.94); --border:#5a4a2e; --txt:#d8cdb4; --dim:#8a7f68;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Georgia,'Times New Roman',serif;color:var(--txt);}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;}
.hidden{display:none !important;}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5;}
#hud.dim{opacity:.55;transition:opacity .5s;}
.orb{position:absolute;bottom:26px;width:118px;height:118px;border-radius:50%;
  border:3px solid #3a3226;box-shadow:0 0 18px #000 inset,0 2px 8px #000;overflow:hidden;background:#0a0a0c;}
#orbHp{left:calc(50% - 210px);}
#orbMp{right:calc(50% - 210px);}
.orbfill{position:absolute;left:0;right:0;bottom:0;height:0%;}
#orbHpFill{background:linear-gradient(180deg,#c33a3a,#5c1010);}
#orbMpFill{background:linear-gradient(180deg,#4a86d8,#14245c);}
.orbTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;text-shadow:0 1px 3px #000;z-index:2;}
.orb .glass{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),transparent 55%);}
.orb.low{animation:orbPulse .8s infinite alternate;}
@keyframes orbPulse{from{box-shadow:0 0 6px #300 inset,0 0 14px #a32b2b;}to{box-shadow:0 0 10px #300 inset,0 0 26px #ff4444;}}
#stamWrap{position:absolute;bottom:158px;left:50%;transform:translateX(-50%);width:340px;height:9px;background:#111;border:1px solid #444;border-radius:4px;opacity:.9;transition:opacity .6s;}
#stamWrap.full{opacity:0;}
#stamFill{height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#3f7d3f,#7ac45a);}
#xpWrap{position:absolute;bottom:0;left:0;right:0;height:7px;background:#0c0c0e;border-top:1px solid #2c2417;}
#xpFill{height:100%;width:0%;background:linear-gradient(90deg,#7d5a1e,#e8c84a);}
#xpTxt{position:absolute;bottom:9px;right:8px;font-size:11px;color:var(--dim);}
#ptsBadge{position:absolute;bottom:9px;left:8px;font-size:11px;color:#e8c84a;text-shadow:0 1px 2px #000;}
#hotbar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:5px;}
.slot{width:44px;height:44px;background:rgba(10,9,8,.82);border:2px solid #4a3e28;border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;font-size:20px;}
.slot canvas{width:100%;height:100%;}
.slot .cnt{position:absolute;right:2px;bottom:0;font-size:11px;color:#fff;text-shadow:0 1px 2px #000;z-index:2;}
.slot .key{position:absolute;left:2px;top:0;font-size:9px;color:var(--dim);z-index:2;}
.slot .cd{position:absolute;inset:0;background:rgba(0,0,0,.65);transform-origin:bottom;pointer-events:none;border-radius:4px;}
.slot.empty{opacity:.55;}
.slot.skill{border-color:#2e5a7a;margin-left:10px;}
#skillSlots{position:absolute;bottom:74px;left:50%;transform:translateX(-50%);display:flex;gap:6px;}
#minimapWrap{position:absolute;top:10px;left:10px;background:rgba(5,5,7,.72);border:1px solid #3a3226;border-radius:4px;padding:2px;}
#minimap{display:block;}
#floorLbl{font-size:10px;color:var(--dim);text-align:center;padding:1px 0;}
#statusRow{position:absolute;bottom:180px;left:calc(50% - 210px);display:flex;flex-direction:column;gap:3px;align-items:flex-start;}
.stChip{font-size:11px;padding:1px 7px;background:rgba(0,0,0,.6);border:1px solid #4a3e28;border-radius:8px;color:#d8cdb4;}
#buffRow{position:absolute;top:60px;right:12px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;}
#logBox{position:absolute;left:12px;bottom:60px;width:330px;font-size:12px;line-height:1.35;text-shadow:0 1px 2px #000;}
#logBox div{opacity:.95;}
#promptBox{position:absolute;bottom:210px;left:50%;transform:translateX(-50%);font-size:15px;text-align:center;text-shadow:0 1px 3px #000;color:var(--gold2);white-space:pre-line;}
#promptBox .kb{display:inline-block;border:1px solid var(--gold);border-radius:3px;padding:0 5px;font-size:12px;margin-right:4px;color:#fff;background:rgba(0,0,0,.5);}
#bossBarWrap{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:min(620px,70vw);text-align:center;}
#bossName{font-size:16px;color:#e8c84a;text-shadow:0 1px 3px #000;margin-bottom:2px;}
#bossBar{height:12px;background:#180c0c;border:1px solid #6a2a2a;border-radius:3px;overflow:hidden;}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#8b1a1a,#d04040);}
#targetBarWrap{position:absolute;top:calc(50% + 26px);left:50%;transform:translateX(-50%);width:200px;text-align:center;font-size:12px;text-shadow:0 1px 2px #000;}
#targetBar{height:5px;background:#101010;border:1px solid #3a3a3a;border-radius:2px;overflow:hidden;margin-top:1px;}
#targetFill{height:100%;width:100%;background:#b04a4a;}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(230,220,200,.85);}
#crosshair::before{left:8px;top:2px;width:2px;height:14px;}
#crosshair::after{top:8px;left:2px;height:2px;width:14px;}
#crosshair.hot::before,#crosshair.hot::after{background:#ff5555;}
#floorTitle{position:absolute;top:16%;left:0;right:0;text-align:center;font-size:34px;color:var(--gold2);text-shadow:0 2px 10px #000;opacity:0;transition:opacity 1s;letter-spacing:2px;}
#floorSub{font-size:15px;color:var(--dim);margin-top:6px;letter-spacing:4px;}
#dmgLayer{position:absolute;inset:0;overflow:hidden;}
.dmgNum{position:absolute;font-size:15px;font-weight:bold;text-shadow:0 1px 2px #000;pointer-events:none;white-space:nowrap;}
#toastBox{position:absolute;top:100px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;z-index:30;pointer-events:none;}
.toast{background:rgba(12,10,8,.92);border:1px solid var(--border);border-radius:4px;padding:7px 18px;font-size:14px;color:var(--gold2);animation:toastIn .25s ease-out;}
.toast.bad{color:#e08080;border-color:#6a3a3a;}
.toast.good{color:#a8d8a0;}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:40;}
#version{position:absolute;right:6px;top:4px;font-size:10px;color:#555;z-index:6;}
#channelWrap{position:absolute;bottom:250px;left:50%;transform:translateX(-50%);width:220px;height:8px;background:#111;border:1px solid #4a3e28;border-radius:4px;}
#channelFill{height:100%;width:0%;background:linear-gradient(90deg,#6a4a9a,#c0a8ff);border-radius:3px;}
/* ---------- Screens / panels ---------- */
#screens{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;}
#screens.dim{background:rgba(0,0,0,.55);}
.panel{background:var(--panel);border:2px solid var(--border);border-radius:8px;box-shadow:0 8px 40px #000;padding:16px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;}
.panel h2{color:var(--gold2);font-size:20px;margin-bottom:10px;letter-spacing:1px;font-weight:normal;}
.panel h3{color:var(--gold);font-size:14px;margin:10px 0 5px;font-weight:normal;}
.btn{display:inline-block;background:linear-gradient(180deg,#2a241c,#1a1611);border:1px solid var(--border);color:var(--txt);padding:6px 16px;border-radius:4px;cursor:pointer;font-size:14px;font-family:inherit;pointer-events:auto;}
.btn:hover{background:linear-gradient(180deg,#3a3024,#221c14);color:#fff;border-color:var(--gold);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.small{padding:2px 9px;font-size:12px;}
.btn.gold{border-color:var(--gold);color:var(--gold2);}
.btn.danger{border-color:#7a3030;color:#e09090;}
.row{display:flex;gap:8px;align-items:center;}
.tabs{display:flex;gap:2px;margin-bottom:8px;}
.tab{padding:5px 14px;background:#171310;border:1px solid #332a1c;border-bottom:none;border-radius:4px 4px 0 0;cursor:pointer;color:var(--dim);font-size:13px;}
.tab.act{color:var(--gold2);background:#241e15;border-color:var(--border);}
.grid{display:grid;gap:0;}
.cell{width:34px;height:34px;background:rgba(255,255,255,.03);border:1px solid #2c261c;position:relative;}
.cell.hi{background:rgba(200,170,90,.15);}
.cell.bad{background:rgba(180,60,60,.2);}
.itm{position:absolute;cursor:grab;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:3;border:1px solid rgba(255,255,255,.12);}
.itm:hover{outline:1px solid #fff;}
.itm.q{outline:1px solid #c9a86a;}
.tt{position:absolute;z-index:60;max-width:340px;background:rgba(8,7,6,.97);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:12.5px;line-height:1.45;pointer-events:none;box-shadow:0 4px 20px #000;}
.tt h4{font-size:15px;margin-bottom:2px;font-weight:normal;}
.tt .dim{color:var(--dim);font-size:11px;}
.tt .aff{color:#9ec2e8;}
.tt .req-bad{color:#d86a6a;}
.tt .cmp{margin-top:6px;border-top:1px solid #2c261c;padding-top:4px;font-size:11.5px;}
.tt .up{color:#9ecf8a;} .tt .dn{color:#d88a8a;}
.dragGhost{position:fixed;z-index:70;pointer-events:none;font-size:20px;filter:drop-shadow(0 3px 6px #000);}
.list{overflow-y:auto;border:1px solid #2c261c;border-radius:4px;background:rgba(0,0,0,.25);}
.list::-webkit-scrollbar{width:8px;} .list::-webkit-scrollbar-thumb{background:#3a3226;border-radius:4px;}
.vrow{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border-bottom:1px solid #201a12;cursor:pointer;font-size:13px;}
.vrow:hover{background:rgba(200,170,90,.08);}
.vrow.dis{opacity:.45;cursor:default;}
.statline{display:flex;justify-content:space-between;font-size:13px;padding:2px 4px;border-bottom:1px solid #1c1812;}
.statline b{color:var(--gold2);font-weight:normal;}
.attrRow{display:flex;align-items:center;justify-content:space-between;padding:3px 4px;font-size:14px;}
.plusBtn{width:22px;height:22px;background:#2a241c;border:1px solid var(--gold);color:var(--gold2);border-radius:3px;cursor:pointer;font-size:15px;line-height:1;}
.plusBtn:hover{background:#4a3c26;}
.plusBtn:disabled{opacity:.3;}
.talRow{padding:6px 8px;border-bottom:1px solid #201a12;}
.pips{display:inline-flex;gap:2px;margin-left:8px;vertical-align:middle;}
.pip{width:8px;height:8px;border-radius:2px;background:#332a1c;border:1px solid #55452a;}
.pip.on{background:var(--gold);}
.qentry{padding:6px 8px;border-bottom:1px solid #201a12;font-size:13px;}
.qentry .obj{color:var(--dim);font-size:12px;padding-left:12px;}
.qentry .done{color:#8a8;text-decoration:line-through;}
#dlgBox{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);width:min(680px,86vw);z-index:25;}
#dlgText{font-size:15px;line-height:1.5;margin-bottom:10px;min-height:60px;}
.dlgOpt{display:block;width:100%;text-align:left;margin-top:5px;}
.dlgName{color:var(--gold2);font-size:16px;margin-bottom:6px;}
#menuRoot{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#181410 0%,#060505 80%);}
#menuTitle{font-size:52px;color:var(--gold2);letter-spacing:8px;text-align:center;text-shadow:0 3px 14px #000;margin-bottom:4px;}
#menuSub{color:var(--dim);text-align:center;letter-spacing:3px;font-size:13px;margin-bottom:34px;}
.menuBtns{display:flex;flex-direction:column;gap:10px;width:280px;}
.menuBtns .btn{text-align:center;font-size:16px;padding:10px;}
.classCard{border:1px solid #3a3226;border-radius:6px;padding:10px;width:200px;cursor:pointer;background:rgba(0,0,0,.3);}
.classCard.sel{border-color:var(--gold);background:rgba(200,170,90,.08);box-shadow:0 0 14px rgba(200,170,90,.2);}
.classCard h4{color:var(--gold2);font-size:16px;font-weight:normal;margin-bottom:4px;}
.classCard .dim{font-size:11px;color:var(--dim);line-height:1.4;}
input[type=text],select{background:#151210;border:1px solid var(--border);color:var(--txt);padding:6px 8px;border-radius:4px;font-family:inherit;font-size:14px;pointer-events:auto;}
input[type=range]{pointer-events:auto;accent-color:#c9a86a;}
input[type=checkbox]{pointer-events:auto;accent-color:#c9a86a;width:15px;height:15px;}
.setRow{display:flex;justify-content:space-between;align-items:center;padding:5px 2px;border-bottom:1px solid #201a12;font-size:13.5px;gap:20px;}
.setRow label{color:var(--txt);}
.kb2{border:1px solid #6a5a3a;background:#1a1611;padding:1px 8px;border-radius:3px;cursor:pointer;font-size:12px;color:var(--gold2);min-width:80px;text-align:center;pointer-events:auto;}
.helpTable{font-size:12.5px;line-height:1.7;}
.helpTable td{padding:1px 12px 1px 0;color:var(--dim);}
.helpTable td:first-child{color:var(--gold2);white-space:nowrap;}
#charSlots{width:420px;}
#deathBox{text-align:center;}
#deathBox h1{font-size:44px;color:#8b1a1a;letter-spacing:6px;margin-bottom:10px;text-shadow:0 0 24px #300;}
#deathBox p{color:var(--dim);margin-bottom:20px;line-height:1.6;}
#victoryBox{text-align:center;}
#victoryBox h1{font-size:38px;color:var(--gold2);letter-spacing:4px;margin-bottom:12px;text-shadow:0 0 30px #c9a86a55;}
#victoryBox p{color:var(--txt);max-width:560px;line-height:1.7;margin:0 auto 18px;font-size:14.5px;}
#nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c66;font-size:18px;z-index:100;}
.cred{color:var(--dim);font-size:12px;line-height:1.7;text-align:center;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="nogl" class="hidden">WebGL2 is not available in this browser.</div>

<div id="hud" class="hidden">
  <div class="orb" id="orbHp"><div class="orbfill" id="orbHpFill"></div><div class="glass"></div><div class="orbTxt" id="orbHpTxt"></div></div>
  <div class="orb" id="orbMp"><div class="orbfill" id="orbMpFill"></div><div class="glass"></div><div class="orbTxt" id="orbMpTxt"></div></div>
  <div id="stamWrap"><div id="stamFill"></div></div>
  <div id="skillSlots">
    <div class="slot skill" id="slotQ"><span class="key">Q</span><span class="cnt"></span><div class="cd hidden"></div></div>
    <div class="slot skill" id="slotR"><span class="key">R</span><span class="cnt"></span><div class="cd hidden"></div></div>
  </div>
  <div id="hotbar"></div>
  <div id="xpWrap"><div id="xpFill"></div></div>
  <div id="xpTxt"></div><div id="ptsBadge"></div>
  <div id="minimapWrap"><canvas id="minimap" width="176" height="176"></canvas><div id="floorLbl"></div></div>
  <div id="statusRow"></div>
  <div id="buffRow"></div>
  <div id="logBox"></div>
  <div id="promptBox"></div>
  <div id="bossBarWrap" class="hidden"><div id="bossName"></div><div id="bossBar"><div id="bossFill"></div></div></div>
  <div id="targetBarWrap" class="hidden"><span id="targetName"></span><div id="targetBar"><div id="targetFill"></div></div></div>
  <div id="crosshair"></div>
  <div id="floorTitle"><div id="ftMain"></div><div id="floorSub"></div></div>
  <div id="dmgLayer"></div>
  <div id="channelWrap" class="hidden"><div id="channelFill"></div></div>
</div>

<div id="screens"></div>
<div id="dlgBox" class="panel hidden"><div id="dlgName" class="dlgName"></div><div id="dlgText"></div><div id="dlgOpts"></div></div>
<div id="toastBox"></div>
<div id="tooltip" class="tt hidden"></div>
<div id="fade"></div>
<div id="version">Hollowmere build 1.0</div>
<div id="menuRoot"></div>

<script src="game.js"></script>
</body>
</html>
